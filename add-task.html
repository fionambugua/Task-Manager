<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" type="text/css" />
    <title>Add Task</title>
  </head>
  <body>
    <!-- header -->
    <header>
      <h1>Task Manager</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">Tasks</a>
        <a href="add-task.html">Add Task</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Add New Task</h2>
        <!-- task form -->
        <form id="taskForm">
          <label for="Task">Task</label><br /><br />
          <input
            type="text"
            id="title"
            placeholder="Task title"
          /><br /><br />
          <textarea
            id="description"
            placeholder="Task description"
          ></textarea
          ><br /><br />
          <button type="submit" id="add-task">Add Task</button>
        </form>
      </section>
    </main>
    <!-- footer -->
    <footer>Copyright (c) 2026</footer>
    <script src="./code.js" defer></script>
  </body>
</html>
